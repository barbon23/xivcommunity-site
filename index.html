<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XIVCOMMUNITY — Competitive CODM Clan, Philippines</title>
  <meta name="description" content="XIVCOMMUNITY is a competitive Call of Duty: Mobile clan based in the Philippines. Active since 2021. Join us for scrims, clan wars, and a serious community.">
  <meta name="theme-color" content="#000000">

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="XIVCOMMUNITY — Competitive CODM Clan">
  <meta property="og:description" content="A competitive Call of Duty: Mobile clan based in the Philippines. Active since 2021.">
  <meta property="og:url"         content="https://xivcommunity.gg/">
  <meta property="og:image"       content="/assets/brand/og.jpg">
  <meta name="twitter:card"       content="summary_large_image">
  <meta name="twitter:title"      content="XIVCOMMUNITY — Competitive CODM Clan">
  <meta name="twitter:description" content="A competitive Call of Duty: Mobile clan based in the Philippines.">
  <meta name="twitter:image"      content="/assets/brand/og.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/brand/logo.png">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components/button.css">
  <link rel="stylesheet" href="/css/components/navbar.css">
  <link rel="stylesheet" href="/css/components/bottom-nav.css">
  <link rel="stylesheet" href="/css/components/footer.css">
  <link rel="stylesheet" href="/css/components/card.css">
  <link rel="stylesheet" href="/css/components/member-card.css">
  <link rel="stylesheet" href="/css/components/member-modal.css">
  <link rel="stylesheet" href="/css/components/avatar-row.css">
  <link rel="stylesheet" href="/css/components/phone-frame.css">
  <link rel="stylesheet" href="/css/components/marquee.css">
  <link rel="stylesheet" href="/css/components/badge.css">
  <link rel="stylesheet" href="/css/pages/home.css">

  <link rel="canonical" href="https://xivcommunity.gg/">
  <link rel="preload" href="/assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

  <!-- Navbar (rendered by navbar.js) -->
  <header id="site-header">
    <noscript>
      <nav style="padding:16px 24px;border-bottom:1px solid #e5e5e5;display:flex;gap:24px;font-family:sans-serif;font-size:14px">
        <a href="/index.html">Home</a>
        <a href="/members.html">Members</a>
        <a href="/blog.html">Blog</a>
        <a href="/support.html">Support</a>
        <a href="/rules.html">Rules</a>
      </nav>
    </noscript>
  </header>

  <main>

    <!-- ═══════════════════════════════════════
         HERO (rendered by site-content.js)
    ═══════════════════════════════════════ -->
    <section class="hero" aria-labelledby="hero-heading">
      <div class="container">
        <div class="hero__inner">

          <div class="hero__content" id="hero-content">
            <!-- Eyebrow, heading, sub, buttons, social proof (from content.json) -->
          </div>

          <!-- Phone mockup (rendered by site-content.js) -->
          <div class="hero__media" id="hero-media" aria-hidden="true"></div>

        </div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════
         FEATURE BLURBS (rendered by site-content.js)
    ═══════════════════════════════════════ -->
    <section class="section section--alt" aria-labelledby="features-heading">
      <div class="container">
        <div class="section-header" data-text-slot="features">
          <!-- Label + heading from content.json -->
        </div>

        <div id="feature-blurbs">
          <!-- Feature blurbs (from content.json) -->
        </div>

      </div>
    </section>

    <!-- ═══════════════════════════════════════
         SCREENSHOT MARQUEE (rendered by site-content.js)
    ═══════════════════════════════════════ -->
    <section class="section" aria-label="Screenshot gallery" aria-hidden="true">
      <div class="marquee" id="marquee">
        <!-- Both rows (from content.json) -->
      </div>
    </section>

    <!-- ═══════════════════════════════════════
         ACHIEVEMENTS (black section)
    ═══════════════════════════════════════ -->
    <section class="section section--dark" aria-labelledby="achievements-heading">
      <div class="container">
        <div class="section-header" data-text-slot="achievements">
          <!-- Label + heading from content.json -->
        </div>
        <div class="badge-grid" id="achievements-grid" aria-live="polite">
          <!-- Rendered by home.js -->
        </div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════
         PARTNERS
    ═══════════════════════════════════════ -->
    <section class="section section--alt" id="partners-section" aria-label="Partner clans and community links">
      <div class="container">
        <div class="section-header" data-text-slot="partners">
          <!-- Label from content.json -->
        </div>
        <div class="partners__row" id="partners-row" aria-live="polite">
          <!-- Rendered by home.js; section hidden if empty -->
        </div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════
         MEMBER PREVIEW
    ═══════════════════════════════════════ -->
    <section class="section" aria-labelledby="roster-heading">
      <div class="container">
        <div class="section-header section-header--row" data-text-slot="roster">
          <!-- Label + heading + "See all members" button from content.json -->
        </div>
        <div class="member-preview__grid" id="member-preview" aria-live="polite">
          <!-- Rendered by home.js -->
        </div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════
         LATEST POSTS
    ═══════════════════════════════════════ -->
    <section class="section section--alt" aria-labelledby="posts-heading">
      <div class="container">
        <div class="section-header section-header--row" data-text-slot="posts">
          <!-- Label + heading + "All posts" button from content.json -->
        </div>
        <div class="posts-preview__grid" id="posts-preview" aria-live="polite">
          <!-- Rendered by home.js -->
        </div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════
         WEEKLY SCHEDULE
    ═══════════════════════════════════════ -->
    <section class="section" id="schedule" aria-labelledby="schedule-heading">
      <div class="container">
        <div class="section-header" data-text-slot="schedule">
          <!-- Label + heading + timezone note from content.json -->
        </div>
        <div class="schedule-scroll">
          <table class="schedule__table" aria-label="Weekly event schedule">
            <thead>
              <tr>
                <th scope="col">Day</th>
                <th scope="col">Time (PHT)</th>
                <th scope="col">Event</th>
                <th scope="col">Type</th>
                <th scope="col">Notes</th>
              </tr>
            </thead>
            <tbody id="schedule-table" aria-live="polite">
              <!-- Rendered by schedule.js -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════
         TESTIMONIALS
    ═══════════════════════════════════════ -->
    <section class="section section--alt" aria-labelledby="testimonials-heading">
      <div class="container">
        <div class="section-header" data-text-slot="testimonials">
          <!-- Label + heading from content.json -->
        </div>
        <div class="testimonials__grid" id="testimonials-grid" aria-live="polite">
          <!-- Rendered by home.js -->
        </div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════
         FINAL CTA (rendered by site-content.js)
    ═══════════════════════════════════════ -->
    <section class="section" aria-labelledby="cta-heading">
      <div class="container">
        <div class="cta-block" id="cta-block" data-reveal>
          <!-- Social proof, heading, sub, buttons (from content.json) -->
        </div>
      </div>
    </section>

  </main>

  <!-- Footer (rendered by footer.js) -->
  <footer id="site-footer"></footer>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/pages/home.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
